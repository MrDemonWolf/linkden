name: Backup D1

on:
  schedule:
    # Daily at 04:00 UTC, an hour after the server's 03:00 retention sweep so
    # the dump reflects the pruned state.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    name: Export linkden-db to R2
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run wrangler from the repo root, not apps/server: that directory's
      # wrangler.jsonc pins linkden-db to database_id "local" for `wrangler dev`,
      # which would make `d1 export` look up a database that only exists on
      # disk. With no config in cwd wrangler resolves the name via the API.
      # The bucket (linkden-backups) is created by the Alchemy deploy and
      # expires objects after 30 days.
      - name: Export D1 and upload to R2
        run: |
          WRANGLER=./apps/server/node_modules/.bin/wrangler
          "$WRANGLER" d1 export linkden-db --remote --output=backup.sql --skip-confirmation
          test -s backup.sql
          "$WRANGLER" r2 object put "linkden-backups/d1/$(date -u +%F).sql" --file=backup.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
