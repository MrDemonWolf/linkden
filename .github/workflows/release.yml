name: Release

# version.json is the single source of the app version. When it changes on
# main, tag that commit vX.Y.Z and publish a GitHub release, so
# /repos/mrdemonwolf/LinkDen/releases/latest resolves and the admin's
# "Check for updates" (version.checkUpdate) can report a newer version.
on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:

# Least-privilege default; the release job alone may write.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read version.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' version.json)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=version.json::version must be semver (X.Y.Z[-pre]), got '$VERSION'"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # A pre-release is published but never becomes releases/latest.
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          FLAGS=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "$TAG" "${FLAGS[@]}"
          echo "Published $TAG at $GITHUB_SHA."
