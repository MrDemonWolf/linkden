name: CI

on:
  # Every PR, whatever its base, so stacked PRs get checks before they
  # land on main. Deploy still keys off pushes to main only.
  pull_request:
  push:
    branches: [main]

# Least-privilege default for the whole workflow.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Lint, Type-check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Coverage
        run: bun run test:coverage

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-placeholder-secret-for-build
          CORS_ORIGIN: http://localhost:3001

  security:
    name: Security scan & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The action lives in a subdirectory — the repo root action.yml is a
      # branding stub with no `runs:` section and fails at resolution time.
      #
      # Report-only on purpose (2026-08-21): ~100 open advisories are all in
      # dev tooling transitives (jsdom, miniflare, wrangler, shadcn CLI) with no
      # fix inside their ranges, and none of that ships to the Workers runtime.
      # Runtime deps (next, hono) are kept current by hand. Flip this to
      # blocking once `osv-scanner scan --lockfile=bun.lock` is clean, and use
      # osv-scanner.toml dated ignores for anything triaged after that.
      - name: Dependency & advisory scan (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --config=osv-scanner.toml
            ./

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json
