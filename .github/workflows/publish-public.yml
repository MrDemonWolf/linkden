name: Publish public revision

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a frozen revision, or explicitly recover an interrupted job
        required: true
        default: publish
        type: choice
        options: [publish, recover]
      revision:
        description: Frozen publication revision
        required: true
        type: string
      target:
        description: Approved isolated target
        required: true
        type: choice
        options: [staging, production]
      source_digest:
        description: Frozen public source digest
        required: true
        type: string
      renderer_source_id:
        description: Approved main renderer commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Upload, activation, HTTP checks and recovery must finish before another run touches this target.
concurrency:
  group: public-publication-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'MrDemonWolf/linkden' &&
      github.ref == 'refs/heads/main' &&
      (inputs.target == 'staging' || inputs.target == 'production')
    environment: public-${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PUBLICATION_RUNNER_APPROVED: ${{ vars.PUBLICATION_RUNNER_APPROVED }}
      PUBLICATION_RENDERER_SOURCE_ID: ${{ vars.PUBLICATION_RENDERER_SOURCE_ID }}
      PUBLICATION_JOB_RENDERER_SOURCE_ID: ${{ inputs.renderer_source_id }}
      PUBLICATION_TARGET: ${{ inputs.target }}
      PUBLICATION_OPERATION: ${{ inputs.operation }}
      PUBLICATION_REVISION: ${{ inputs.revision }}
      PUBLICATION_SOURCE_DIGEST: ${{ inputs.source_digest }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLICATION_DATABASE_ID: ${{ vars.PUBLICATION_DATABASE_ID }}
      PUBLICATION_IMAGES_BUCKET: ${{ vars.PUBLICATION_IMAGES_BUCKET }}
      PUBLICATION_IMAGE_ORIGINS: ${{ vars.PUBLICATION_IMAGE_ORIGINS }}
      PUBLICATION_CONTACT_ACTION: ${{ vars.PUBLICATION_CONTACT_ACTION }}

    steps:
      - name: Checkout trusted main renderer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Verify approval and immutable job identity
        run: bun -e 'const { publicationRunnerConfiguration } = await import("./apps/public/runner-config.ts"); publicationRunnerConfiguration(process.env);'

      - name: Require successful CI for this exact main commit
        run: |
          passed=$(gh run list --repo MrDemonWolf/linkden --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --status success --json headSha --jq 'length')
          test "$passed" -gt 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Upload, activate, verify and record frozen public revision
        run: bun apps/public/run.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLICATION_TOKEN }}

      # These files contain public-only data. Retain exact failed candidates too for diagnosis/recovery.
      - name: Retain immutable public artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/public-publication/
          retention-days: 30
          if-no-files-found: ignore
