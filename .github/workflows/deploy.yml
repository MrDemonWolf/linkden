name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy with Alchemy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          WALLET_SIGNER_CERT: ${{ secrets.WALLET_SIGNER_CERT }}
          WALLET_SIGNER_KEY: ${{ secrets.WALLET_SIGNER_KEY }}
          WALLET_WWDR_CERT: ${{ secrets.WALLET_WWDR_CERT }}
          WALLET_TEAM_ID: ${{ secrets.WALLET_TEAM_ID }}
          WALLET_PASS_TYPE_ID: ${{ secrets.WALLET_PASS_TYPE_ID }}

      - name: Smoke test production
        run: |
          sleep 5
          HEALTH_URL="${{ secrets.NEXT_PUBLIC_SERVER_URL }}/api/health"
          echo "Probing $HEALTH_URL"
          RESPONSE=$(curl -fsS --max-time 15 "$HEALTH_URL" || echo "FAILED")
          echo "Response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"status":"ok"'; then
            echo "ERROR: Production health check failed!"
            exit 1
          fi
