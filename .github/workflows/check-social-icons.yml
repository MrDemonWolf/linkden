name: Check Social Icons Updates

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  check-icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Check for new social icons
        run: node scripts/check-social-icons.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/social-networks.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          title: "chore: update social network icons"
          body: |
            Automated check found new social network icons from simple-icons.

            Please review the additions in `data/social-networks.json`.
          branch: chore/update-social-icons
          commit-message: "chore: update social network icons"
